[package]
name = "rust-fs-squashfs"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust SquashFS (read-only) filesystem driver. Clean-room implementation; reads SquashFS 4.0 images with every standard compressor (gzip, xz, lz4, zstd, lzo). Exposes a C ABI (fs_squashfs_*) suitable for FFI from C/C++/Swift/Go/etc."
repository = "https://github.com/antimatter-studios/rust-fs-squashfs"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

# The name this crate had on crates.io: the semver check's baseline until
# a release exists under the new one (rust-fs-core's semver-check.sh).
[package.metadata.semver]
former-name = "am-fs-squashfs"

[lib]
name = "fs_squashfs"
crate-type = ["staticlib", "rlib"]

# THE COMMAND-LINE TOOLS: one multi-call binary, named for the repository.
# It dispatches on argv[0], the way busybox and e2fsprogs do, so the
# release step installs it once as `rust-fs-squashfs` and links
# `fs.squashfs` to it (cargo refuses a dot in a target name, so the dotted
# names are never cargo's). `rust-fs-squashfs <tool> ...` is the form
# nothing else on PATH can shadow, and `cargo run --features cli -- fs ...`
# works before anything is installed. It replaces `lssquashfs`.
#
# BEHIND THE `cli` FEATURE, so the static library a consumer links gains no
# dependency from the tools: `required-features` keeps the target out of a
# build that did not ask for it. scripts/test.sh and `chore lint` ask for
# it, so the tests and clippy reach it.
[[bin]]
name = "rust-fs-squashfs"
path = "src/cli/main.rs"
required-features = ["cli"]

# WHAT THE RELEASE TARBALL SHIPS, read by rust-fs-core's package-cli.sh
# (`scripts/core.sh package-cli`), which release.yml reaches through core's
# release-cli workflow and ci.yml's `cli` job runs on every pull request.
# Each dotted name is a relative symlink to bin/rust-fs-squashfs, with its
# man page in the section given here; the binary's own `generate names`
# must list exactly these, or the packaging fails.
[package.metadata.package-cli]
names = { "fs.squashfs" = 1 }
licenses = ["LICENSE"]

[features]
# The command-line tools and nothing else. The plumbing they share --
# dispatch, --version, doctor, the output contract, man pages and
# completions -- is rust-fs-core's `cli` feature, turned on only here, so
# the static library gains nothing. clap is MIT/Apache-2.0.
cli = ["dep:clap", "rust-fs-core/cli"]

[dependencies]
# Block-device trait surface shared with the sister crates (qcow2 reader,
# partition probe, fs-ext4 / fs-ntfs drivers). Local path dep until the
# crates publish; the FFI mount path consumes `fs_core::ffi::FsCoreDevice`
# so an FSKit extension (or any FFI consumer) can hand us a block-device
# resource.
rust-fs-core = { path = "../rust-fs-core", version = "0.3.0" }
# LZO1X codec (compression id 3). Extracted from this crate into its own
# published crate so the Btrfs driver can share it rather than each
# carrying a copy — the decoder is identical and the format is not
# SquashFS-specific. Independent implementation from the published stream
# grammar; the widely-used LZO libraries are GPL and unusable here.
rust-lzo1x = "0.4.0"
# gzip/zlib codec (compression id 1). SquashFS gzip blocks are zlib-wrapped
# DEFLATE, decoded via `flate2::Decompress::new(true)`. rust_backend
# (miniz_oxide) keeps the dependency pure-Rust + cleanroom-safe; no
# proc-macro deps.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# xz codec (compression id 4). SquashFS xz blocks are full `.xz` container
# streams, decoded via `lzma_rs::xz_decompress`, or -- when `mksquashfs -Xbcj`
# put a branch converter in the chain -- the LZMA2 payload via
# `lzma_rs::lzma2_decompress` and the converter in src/xz.rs. Pure-Rust, MIT.
lzma-rs = "0.3"
# lz4 codec (compression id 5). SquashFS uses the LZ4 *block* format with
# the uncompressed size known from block geometry; decoded via
# `lz4_flex::block::decompress_into`. `default-features = false` +
# `safe-decode` keeps it pure-safe-Rust; no encoder pulled in. MIT.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
# zstd codec (compression id 6). SquashFS uses standard zstd frames,
# decoded via `ruzstd`'s pure-Rust streaming decoder. MIT.
ruzstd = "0.8"
# LRU map behind the decompressed-metadata cache (`metablock::MetaCache`).
# Same crate and same major the EROFS sister driver uses for its pcluster
# cache, so the two caches behave identically under eviction. MIT, no
# transitive deps beyond hashbrown.
lru = "0.12"
# The command-line tools' argument parser, behind the `cli` feature (see
# the `rust-fs-squashfs` target above). No derive: the builder API keeps
# each tool's command a function the man pages and completions can be made
# from.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
# The suite's one way in to a fixture, to a squashfs-tools oracle and to the
# kernel, all of which live in the fs-linux-test-harness VM. Dev-only: it never
# reaches a consumer of this crate.
fs-squashfs-test-support = { path = "tests/support" }
# Integration tests spawn `mksquashfs` to build fixtures into a tempdir.
tempfile = "3"
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. That guard hand-rolled its own
# scanner and was defeated three times by ordinary YAML -- a quoted "if"
# key, a commented-out trigger, and a `|-` block scalar. Quoted keys,
# block styles and comments are the grammar, not edge cases, so the file
# is parsed rather than scanned. Pure Rust, YAML 1.2 (so GitHub's `on:`
# key stays the string `on` and is not folded into a boolean),
# MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml, which is
# deprecated and wraps unsafe-libyaml. Dev-only: it never reaches a
# consumer of this crate.
saphyr = "0.0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"  # required for catch_unwind at the FFI boundary (see src/capi.rs)

[profile.dev]
opt-level = 1
panic = "unwind"
