name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned tag of the sibling am-fs-core repo used to satisfy the path dep
  # during local build/verify. Bump in lockstep with the am-fs-core version
  # constraint in Cargo.toml when releasing a new fs-squashfs minor.
  FS_CORE_REF: v0.2.13

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The crate has a path dep on am-fs-core (../rust-fs-core). Clone the
      # sibling repo alongside, pinned to FS_CORE_REF, so cargo resolves it.
      # Anonymous HTTPS clone — rust-fs-core is public.
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # squashfs-tools provides mksquashfs / unsquashfs — the oracle
      # binaries the #[ignore]-gated oracle / large-file / stress tests
      # shell out to. Same install as ci.yml so the release-time gate
      # exercises the same path as PR CI.
      #
      # `attr` too, as ci.yml installs it: tests/xattr_oracle.rs needs a way
      # to set an extended attribute and FAILS when `CI` is set and none
      # exists, so without it every tagged release would stop here.
      - name: install squashfs-tools and attr
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools attr
          mksquashfs -version | head -1
          unsquashfs -version | head -1
          setfattr --version | head -1

      - run: cargo clippy --locked --all-targets -- -D warnings
      # A FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE, and it is
      # worse here than in ci.yml: `publish` has `needs: test`, so a test
      # job that executed nothing and exited 0 is the thing that says a
      # crate is fit to go to crates.io. `cargo test` exits 0 on
      # "0 passed; 0 failed", so a build that emitted no test binaries or
      # a harness that died before its first case reports the same green
      # as the full suite, and the release ships on it. Only a count
      # taken from outside the suite sees that. See #101.
      #
      # Measured 2026-09-06 on run 34036563214 (tag v0.1.5, the last
      # green release): 124 executed by this step. Floor 110. The number
      # is lower than ci.yml's 262 for two reasons and neither is a
      # problem: `--all-targets` runs no doctests, and the suite has
      # grown since v0.1.5. A floor measured from an older release is
      # conservative by construction -- it is here to refuse zero, not to
      # track the suite's size.
      - name: cargo test (--all-targets), with an executed-test floor
        run: |
          cargo test --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/test-all-targets.log"
          rc=${PIPESTATUS[0]}
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-all-targets.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 110)"
          if [ "$n" -lt 110 ]; then
              echo "::error::only $n tests executed, floor is 110 — 124 ran on 2026-09-06 (run 34036563214, v0.1.5), and a release must not publish on a test job that stopped early rather than passed"
              exit 1
          fi
          exit "$rc"
      # Oracle tests are #[ignore]-gated so a fresh checkout without
      # squashfs-tools still passes `cargo test`. The oracle is installed
      # above, so opt them in here — this is the canonical "can we read
      # what the upstream tooling emits, across every compressor" gate, the
      # strongest signal the release artifact is sound.
      #
      # ITS OWN FLOOR, BECAUSE `--ignored` SELECTS A DISJOINT SET: it runs
      # the tests the step above skipped and none of the ones it ran, so
      # the `install squashfs-tools and attr` step above failing quietly,
      # or the `#[ignore]` attribute being lifted, empties this step alone
      # and leaves the other at full strength. Being the canonical gate
      # above makes an empty run here the most expensive green in the
      # workflow: a release tagged on a comparison against nothing.
      #
      # Measured 2026-09-06 on run 34036563214 (tag v0.1.5): 17 executed
      # by this step. Floor 15.
      - name: cargo test (--all-targets, --ignored oracles), with an executed-test floor
        run: |
          cargo test --locked --all-targets -- --ignored 2>&1 | tee "$RUNNER_TEMP/test-all-targets-ignored.log"
          rc=${PIPESTATUS[0]}
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-all-targets-ignored.log" | awk '{s+=$4} END{print s+0}')
          echo "ignored-gated tests executed: $n (floor 15)"
          if [ "$n" -lt 15 ]; then
              echo "::error::only $n ignored-gated tests executed, floor is 15 — 17 ran on 2026-09-06 (run 34036563214, v0.1.5); the oracle suite did not run, so this release was validated against nothing"
              exit 1
          fi
          exit "$rc"

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged lockfile,
        # which `--locked` forbids ("cannot update the lock file"). The
        # verify-build resolves am-fs-core from crates.io via the `version`
        # constraint, so the published artifact is pinned by that
        # constraint, not by the local path checkout.
        run: cargo publish
