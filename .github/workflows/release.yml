name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned tag of the sibling am-fs-core repo used to satisfy the path dep
  # during local build/verify. Bump in lockstep with the am-fs-core version
  # constraint in Cargo.toml when releasing a new fs-squashfs minor.
  FS_CORE_REF: v0.2.13

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The crate has a path dep on am-fs-core (../rust-fs-core). Clone the
      # sibling repo alongside, pinned to FS_CORE_REF, so cargo resolves it.
      # Anonymous HTTPS clone — rust-fs-core is public.
      - name: Install chore
        run: scripts/ci-install-chore.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # THE RELEASE GATE IS THE SAME GATE, through the same tasks.
      #
      # This used to install squashfs-tools on the runner and run `cargo
      # test --all-targets` and then `-- --ignored`, each with its own
      # executed-test floor. All three parts are obsolete:
      #
      #   * the tools live in the fs-linux-test-harness guest now, built
      #     from a pinned source with every codec, so installing whatever
      #     the runner's archive has would validate a release against the
      #     wrong tool;
      #   * there are no `#[ignore]`d tests left, so a second `--ignored`
      #     pass selects nothing — a step that can only ever report zero,
      #     which is exactly the empty green its own comment warned about;
      #   * the floors moved into chores.yml, measured per tier, and a
      #     floor restated here would be a second copy to drift.
      #
      # `chore test` is what PR CI runs, so a release is gated on the same
      # thing rather than on a workflow-shaped imitation of it. Its tiers
      # carry their own floors, and a tier that executed too little fails
      # inside the task — which `publish: needs: test` then blocks on.
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore tools
        run: chore tools
      - name: chore lint
        run: chore lint
      - name: chore test
        run: chore test
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: tmp/logs/*.log
          if-no-files-found: error

  publish:
    name: publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - uses: dtolnay/rust-toolchain@stable

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged lockfile,
        # which `--locked` forbids ("cannot update the lock file"). The
        # verify-build resolves am-fs-core from crates.io via the `version`
        # constraint, so the published artifact is pinned by that
        # constraint, not by the local path checkout.
        run: cargo publish
