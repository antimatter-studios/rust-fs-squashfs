name: CI

# EVERY JOB RUNS CHORE TASKS, so a green local `chore test` is the same
# gate CI applies. Nothing here duplicates a budget or a floor: those live
# in chores.yml, measured, and a job that re-stated one would be a second
# copy to drift.
#
#   unit         `chore test:unit` on a runner with NO VM: the tests that
#                need no tool, no fixture and no kernel. It is the job that
#                proves the split is real.
#   test         x86_64, where GitHub gives us KVM: `chore lint` and
#                `chore test` — the whole gate, with every squashfs-tools
#                call and every mount happening inside the harness VM.
#   test-arm64   the architecture this crate actually ships on. GitHub's
#                arm64 runners have no /dev/kvm, so no VM can start: this
#                runs the VM-free tiers there, which is more than the old
#                workflow ran on arm64 at all.
#   suite-in-vm  `chore test:vm`: the whole suite COMPILED AND RUN INSIDE
#                the guest. This is the path a macOS developer takes, and
#                it is checked here so it cannot rot unnoticed.
#   cli          `chore cli:install` then `chore test:cli`: the command-line
#                tools built in release mode, staged under every name first
#                on PATH, and tested AS INSTALLED -- `rust-fs-squashfs
#                doctor` first, then tests/cli/*.sh on the committed fixture.
#                A change that breaks a tool fails the pull request, not the
#                release. Then the release tarball is packaged from the same
#                build and its layout checked by rust-fs-core's package-cli
#                (scripts/core.sh package-cli), the same packaging
#                release.yml reaches through core's release-cli workflow, so
#                a release is not the first time it is put together. No VM here: what squashfs-tools and the kernel make
#                of the tool's reads is judged in the oracle and kernel tiers,
#                in the `test` job.
#   ci-ok        the one required check: green only when every job above
#                succeeded, and red when any was skipped or cancelled.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"

jobs:
  unit:
    name: unit (no tools, no VM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        # Pinned (CHORE_VERSION) and checked against the release's
        # checksums: the siblings, the tools and the tests all come
        # through it.
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        # rust-fs-core (the path dependency) and fs-linux-test-harness, at
        # the refs pinned in chores.yml.
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-unit-cargo-${{ hashFiles('**/Cargo.lock') }}
      # NO `chore tools` STEP, AND THAT IS NOT AN OMISSION.
      #
      # `scripts/tools.sh` in install mode also checks the VM HOST through the
      # harness's host-tools.sh — qemu and read-write /dev/kvm — because that
      # is what a developer running `chore tools` wants to know. This runner
      # has no /dev/kvm and is not meant to, so the step failed here while the
      # jobs that actually use a VM passed:
      #
      #   missing: read-write access to /dev/kvm
      #   chore: tools: exit status 1
      #
      # The tiers that need the host's own tools call `scripts/tools.sh
      # --check` themselves, and `--check` leaves the VM out for exactly this
      # reason. The unit tier needs a C compiler for the header-layout test,
      # and that test fails naming `chore tools` if one is absent.
      - name: chore test:unit
        run: chore test:unit
      - name: Keep the tier logs
        # A quiet tier writes its detail to tmp/logs/<tier>.log and prints a
        # verdict; without this the detail dies with the runner and the only
        # record left is the one line the terminal got. `if: always()`
        # because the run worth reading is the one that failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-unit
          path: tmp/logs/*.log
          if-no-files-found: error

  test:
    name: test (x86_64, oracles in the VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore tools
        run: chore tools
      # THE EVIDENCE, NOT THE CLAIM.
      #
      # ubuntu-24.04 ships squashfs-tools, and it is a version nobody here
      # chose. If a test reached for it the run would pass having compared
      # this driver against the wrong tool — which is exactly the failure
      # this migration removes, and exactly the failure that is invisible.
      #
      # So every one of them is replaced with a stub that fails loudly.
      # tests/test_contract.rs refuses the shapes that could get here, and
      # this is the belt: the contract reads source, this watches behaviour.
      - name: Make any squashfs-tools on the runner unusable
        run: |
          set -eu
          for tool in mksquashfs unsquashfs sqfstar squashfuse; do
            path="$(command -v "$tool" 2>/dev/null || true)"
            [ -n "$path" ] || continue
            sudo mv "$path" "$path.host-copy"
            printf '#!/bin/sh\necho "::error::%s ran on the runner; the oracle tools belong in the VM" >&2\nexit 97\n' \
              "$tool" | sudo tee "$path" >/dev/null
            sudo chmod +x "$path"
            echo "poisoned $path"
          done
      - name: chore lint
        run: chore lint
      - name: chore test
        run: chore test
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-x86_64
          path: tmp/logs/*.log
          if-no-files-found: error
      - name: chore vm:status (the VM is down again)
        # The reaper in chores.yml's lifecycle stops a VM nothing else
        # brought down. If one is still up the run leaked it, and a leaked
        # VM holds the machine-wide slot.
        run: '! chore vm:status'

  test-arm64:
    name: test (aarch64, no KVM on this runner)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
      # No `chore tools` here either: GitHub's arm64 runners have no
      # /dev/kvm, and install-mode tools.sh checks for it. See the unit job.
      #
      # NO VM ON THIS RUNNER, so only the tiers that need none. This is
      # the architecture the crate ships on, and before the tiers existed
      # it ran nothing here that read an image at all.
      #
      # `chore lint` runs here as well as on x86_64 on purpose: clippy's
      # findings are not always architecture-independent — a cast or an
      # alignment assumption can be a warning on one target and silent on
      # the other — and this is the target the crate ships on.
      - name: chore lint
        run: chore lint
      - name: chore test:unit
        run: chore test:unit
      - name: chore test:images
        run: chore test:images
      - name: chore test:scripts
        run: chore test:scripts
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-aarch64
          path: tmp/logs/*.log
          if-no-files-found: error

  suite-in-vm:
    name: suite in the guest (the macOS path)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      # NO RUST ON THE HOST for this job, deliberately: the guest has its
      # own pinned toolchain and builds the suite with it. A host cargo
      # here would only hide the guest's toolchain going missing.
      - name: chore test:vm
        run: chore test:vm
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-suite-in-vm
          path: tmp/logs/*.log
          if-no-files-found: error

  cli:
    name: cli (the installed tools, on PATH)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-cargo-
      - name: chore cli:install
        run: chore cli:install
      # FIRST on PATH, ahead of anything the runner has under the same
      # names -- which doctor then reports as present and not run.
      - name: The staged tools first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: chore test:cli
        id: tier
        run: chore test:cli
      # The tarball release.yml attaches, from the build the tier just
      # tested: bin/, the man pages, the completions, CAVEATS and LICENSE,
      # each dotted name a relative symlink answering for this version.
      - name: The release tarball, packaged and its layout checked
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p tmp/package
          cd tmp/package
          bash ../../scripts/core.sh package-cli "$version" linux-x86_64
      - name: Keep the tier logs
        # Not before the tier ran: there is no log then, and this step's red
        # would hide the real one.
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-cli
          path: tmp/logs/*.log
          if-no-files-found: error

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#104).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system from
  # the file that produces them. Rename a job and the required check is a
  # name nothing reports — permanently pending, nothing merges, no failure
  # to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a job
  # that passed, and an aggregate that only ran when its needs succeeded
  # would be skipped itself — and a skipped required check never reports.
  semver:
    # `chore check:semver`: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        # rust-fs-core, the path dependency the current tree builds against.
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: chore check:semver
        shell: bash
        run: chore check:semver

  ci-ok:
    name: ci-ok
    if: always()
    needs: [unit, test, test-arm64, suite-in-vm, cli, semver]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
